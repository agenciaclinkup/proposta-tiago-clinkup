services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Configure NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?Configure NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Configure NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME:-}
        NEXT_PUBLIC_BRAND_NAME: ${NEXT_PUBLIC_BRAND_NAME:-}
        NEXT_PUBLIC_BRAND_LOGO_URL: ${NEXT_PUBLIC_BRAND_LOGO_URL:-}
        NEXT_PUBLIC_BRAND_FAVICON_URL: ${NEXT_PUBLIC_BRAND_FAVICON_URL:-}
        NEXT_PUBLIC_BRAND_SUPPORT_EMAIL: ${NEXT_PUBLIC_BRAND_SUPPORT_EMAIL:-}
        NEXT_PUBLIC_BRAND_SUPPORT_WHATSAPP: ${NEXT_PUBLIC_BRAND_SUPPORT_WHATSAPP:-}
        NEXT_PUBLIC_BRAND_PRIMARY: ${NEXT_PUBLIC_BRAND_PRIMARY:-}
        NEXT_PUBLIC_BRAND_SECONDARY: ${NEXT_PUBLIC_BRAND_SECONDARY:-}
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
  scheduler:
    profiles: ["scheduler"]
    image: node:22-alpine
    user: node
    read_only: true
    init: true
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
    volumes:
      - ./deploy/cron.mjs:/cron.mjs:ro
    command: ["node", "/cron.mjs"]
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
